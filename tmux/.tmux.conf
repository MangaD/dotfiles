# =============================================================================
# Mouse and clipboard
# =============================================================================

# Enable mouse support.
#
# This allows:
#   - Clicking a pane to select it.
#   - Dragging pane borders to resize them.
#   - Clicking windows in the status bar.
#   - Using the mouse wheel to enter copy mode and scroll through history.
set -g mouse on

# Allow tmux to interact with the system clipboard when supported by the
# terminal.
#
# For example, text copied from tmux's copy mode can be made available to
# applications outside tmux.
set -g set-clipboard on


# =============================================================================
# History
# =============================================================================

# Keep up to 50,000 lines of output in each pane's scrollback history.
#
# This controls how far back you can scroll after commands produce output.
# A larger value is particularly useful for compiler output, logs, and other
# commands that print many lines.
set -g history-limit 50000


# =============================================================================
# Windows and panes
# =============================================================================

# Number windows starting from 1 instead of 0.
#
# The default prefix shortcuts for selecting windows use number keys
# (Prefix + 1, Prefix + 2, ...), so starting at 1 maps more naturally to the
# physical number keys on the keyboard.
set -g base-index 1

# Number panes starting from 1 instead of 0 for the same reason.
#
# Pane numbers are visible temporarily with:
#     Prefix + q
#
# You can then press the displayed number to jump directly to that pane.
setw -g pane-base-index 1

# Automatically renumber windows when one is closed.
#
# Without this setting, closing window 2 from:
#
#     1  2  3
#
# leaves:
#
#     1  3
#
# With this setting enabled, tmux renumbers them to:
#
#     1  2
set -g renumber-windows on

# Create new panes in the same directory as the current pane.
#
# Normally, the directory used for a newly created pane can depend on how tmux
# was started. These bindings make splitting predictable:
#
#     Prefix + "    split into top/bottom panes
#     Prefix + %    split into left/right panes
#
# The new pane starts in the directory of the pane being split.
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"


# =============================================================================
# Responsiveness
# =============================================================================

# Reduce the delay tmux uses when deciding whether Escape is a standalone key
# press or the beginning of a terminal escape sequence.
#
# The default delay can make pressing Escape in Vim feel slightly sluggish
# when Vim is running inside tmux.
#
# 10 means 10 milliseconds.
set -sg escape-time 10

# Tell applications running inside tmux when their pane gains or loses focus.
#
# Programs that understand terminal focus events can use this information.
# Vim, for example, can react when its terminal pane becomes active again.
set -g focus-events on


# =============================================================================
# Copy mode
# =============================================================================

# Use Vim-style navigation keys while tmux is in copy mode.
#
# Enter copy mode with:
#
#     Prefix + [
#
# You can then navigate the scrollback buffer using familiar Vim movements
# such as h, j, k, l, w, b, 0, $, /, and ?.
#
# This affects only tmux's copy mode; it does not change the normal tmux
# keybindings.
setw -g mode-keys vi


# =============================================================================
# Status bar
# =============================================================================

# Refresh information displayed in the status bar every five seconds.
#
# This matters for dynamic information such as the clock. A shorter interval
# updates more frequently but is rarely necessary.
set -g status-interval 5

# Allow more space for the session information displayed on the left side of
# the status bar.
set -g status-left-length 30

# Allow more space for information displayed on the right side of the status
# bar.
set -g status-right-length 50


# =============================================================================
# Configuration
# =============================================================================

# Reload this file without restarting tmux.
#
# Press:
#
#     Prefix + r
#
# The default prefix is Ctrl-b, so normally:
#
#     Ctrl-b, then r
#
# This is useful while editing ~/.tmux.conf because changes can be tested
# immediately.
bind r source-file ~/.tmux.conf \; display-message "tmux configuration reloaded"
