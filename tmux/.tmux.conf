# =============================================================================
# Mouse and clipboard
# =============================================================================

# Enable mouse support.
#
# This allows:
#   - Clicking a pane to select it.
#   - Dragging pane borders to resize them.
#   - Clicking windows in the status bar.
#   - Using the mouse wheel to enter copy mode and scroll through history.
set -g mouse on

# Allow tmux to interact with the system clipboard when supported by the
# terminal.
#
# For example, text copied from tmux's copy mode can be made available to
# applications outside tmux.
set -g set-clipboard on


# =============================================================================
# Terminal title
# =============================================================================

# Allow tmux to update the terminal window title.
#
# This is required for terminal title escape sequences generated by programs
# running inside tmux (such as Bash) to be reflected in the outer terminal.
#
# For example, this allows iTerm2 to display a title generated by Bash inside
# a Docker container running within tmux.
set -g set-titles on


# =============================================================================
# History
# =============================================================================

# Keep up to 50,000 lines of output in each pane's scrollback history.
#
# This controls how far back you can scroll after commands produce output.
# A larger value is particularly useful for compiler output, logs, and other
# commands that print many lines.
set -g history-limit 50000


# =============================================================================
# Windows and panes
# =============================================================================

# Number windows starting from 1 instead of 0.
#
# The default prefix shortcuts for selecting windows use number keys
# (Prefix + 1, Prefix + 2, ...), so starting at 1 maps more naturally to the
# physical number keys on the keyboard.
set -g base-index 1

# Number panes starting from 1 instead of 0 for the same reason.
#
# Pane numbers are visible temporarily with:
#     Prefix + q
#
# You can then press the displayed number to jump directly to that pane.
setw -g pane-base-index 1

# Automatically renumber windows when one is closed.
#
# Without this setting, closing window 2 from:
#
#     1  2  3
#
# leaves:
#
#     1  3
#
# With this setting enabled, tmux renumbers them to:
#
#     1  2
set -g renumber-windows on

# Create new panes in the same directory as the current pane.
#
# Normally, the directory used for a newly created pane can depend on how tmux
# was started. These bindings make splitting predictable:
#
#     Prefix + "    split into top/bottom panes
#     Prefix + %    split into left/right panes
#
# The new pane starts in the directory of the pane being split.
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"


# =============================================================================
# Responsiveness
# =============================================================================

# Reduce the delay tmux uses when deciding whether Escape is a standalone key
# press or the beginning of a terminal escape sequence.
#
# The default delay can make pressing Escape in Vim feel slightly sluggish
# when Vim is running inside tmux.
#
# 10 means 10 milliseconds.
set -sg escape-time 10

# Tell applications running inside tmux when their pane gains or loses focus.
#
# Programs that understand terminal focus events can use this information.
# Vim, for example, can react when its terminal pane becomes active again.
set -g focus-events on


# =============================================================================
# Copy mode
# =============================================================================

# Use Vim-style navigation keys while tmux is in copy mode.
#
# Enter copy mode with:
#
#     Prefix + [
#
# You can then navigate the scrollback buffer using familiar Vim movements
# such as h, j, k, l, w, b, 0, $, /, and ?.
#
# This affects only tmux's copy mode; it does not change the normal tmux
# keybindings.
setw -g mode-keys vi


# =============================================================================
# Status bar
# =============================================================================

# Refresh information displayed in the status bar every five seconds.
#
# This matters for dynamic information such as the clock. A shorter interval
# updates more frequently but is rarely necessary.
set -g status-interval 5

# Allow more space for the session information displayed on the left side of
# the status bar.
set -g status-left-length 30

# Allow more space for information displayed on the right side of the status
# bar.
set -g status-right-length 50


# =============================================================================
# Configuration
# =============================================================================

# Reload this file without restarting tmux.
#
# Press:
#
#     Prefix + r
#
# The default prefix is Ctrl-b, so normally:
#
#     Ctrl-b, then r
#
# This is useful while editing ~/.tmux.conf because changes can be tested
# immediately.
bind r source-file ~/.tmux.conf \; display-message "tmux configuration reloaded"


# =============================================================================
# TMUX PLUGINS
# =============================================================================
#
# TPM (Tmux Plugin Manager) is used to install and manage the plugins below.
#
# After adding this section:
#   1. Reload your tmux configuration.
#   2. Press <prefix> + I (capital i) to install the plugins.
#
# With the default tmux prefix, that means:
#   Ctrl-b, then Shift-i
#
# TPM must be initialized at the very bottom of this section/configuration.
# =============================================================================

# -----------------------------------------------------------------------------
# TPM — Tmux Plugin Manager
# -----------------------------------------------------------------------------
#
# Provides the plugin-management infrastructure used by the other plugins.
#
# It does not itself change how tmux behaves; it allows us to declare plugins
# with `set -g @plugin ...` and install/update them from inside tmux.
#
set -g @plugin 'tmux-plugins/tpm'


# -----------------------------------------------------------------------------
# tmux-sensible — sensible default settings
# -----------------------------------------------------------------------------
#
# Provides a small collection of generally useful tmux defaults.
#
# This is intentionally kept separate from our own configuration: your
# existing settings remain authoritative where you have explicitly configured
# the same behavior.
#
set -g @plugin 'tmux-plugins/tmux-sensible'


# -----------------------------------------------------------------------------
# tmux-resurrect — save and restore tmux sessions
# -----------------------------------------------------------------------------
#
# Resurrect lets you save the state of your tmux environment and restore it
# later, including across a machine reboot.
#
# It can restore things such as:
#   - sessions
#   - windows
#   - panes
#   - pane working directories
#   - pane contents (enabled below)
#   - selected programs/processes when configured appropriately
#
# Manual save:
#   <prefix> + Ctrl-s
#
# Manual restore:
#   <prefix> + Ctrl-r
#
set -g @plugin 'tmux-plugins/tmux-resurrect'


# -----------------------------------------------------------------------------
# tmux-continuum — automatic tmux persistence
# -----------------------------------------------------------------------------
#
# Continuum works together with tmux-resurrect.
#
# Instead of requiring you to manually save your tmux environment, Continuum
# periodically creates Resurrect saves.
#
# Its default automatic-save interval is 15 minutes, so we deliberately do
# not specify @continuum-save-interval here.
#
# Continuum can also automatically restore the most recent saved environment
# when the tmux server starts.
#
# IMPORTANT:
# Continuum should be the last plugin in the plugin list because it integrates
# with tmux's status line for its automatic-save functionality.
#
set -g @plugin 'tmux-plugins/tmux-continuum'


# =============================================================================
# TMUX-RESURRECT SETTINGS
# =============================================================================

# -----------------------------------------------------------------------------
# Restore pane contents
# -----------------------------------------------------------------------------
#
# Without this, Resurrect primarily restores the tmux structure (sessions,
# windows, panes, directories, etc.).
#
# Enabling this also saves the contents of panes, which is useful after a
# restart because terminal output that was present before the restart can be
# brought back.
#
# Note that this is not a replacement for application-level persistence.
# For example, an unsaved Vim/Neovim buffer is not magically recovered just
# because tmux captured the pane contents.
#
set -g @resurrect-capture-pane-contents 'on'


# -----------------------------------------------------------------------------
# Save shell command history
# -----------------------------------------------------------------------------
#
# Save the shell's command history as part of the Resurrect environment.
#
# This is separate from pane-content capture:
#
#   @resurrect-capture-pane-contents
#       Saves terminal output that was displayed in the pane.
#
#   @resurrect-save-shell-history
#       Saves the shell's command history so commands entered before a restart
#       can be retained.
#
# This is useful when working on remote servers or long-running projects where
# being able to recover your recent shell commands is valuable.
#
set -g @resurrect-save-shell-history 'on'


# -----------------------------------------------------------------------------
# Vim session restoration
# -----------------------------------------------------------------------------
#
# When Vim is running inside a resurrected pane, use Vim's session mechanism
# to restore the editor's state rather than merely starting a fresh Vim
# process.
#
# This applies to Vim (`vim`).
#
set -g @resurrect-strategy-vim 'session'


# -----------------------------------------------------------------------------
# Neovim session restoration
# -----------------------------------------------------------------------------
#
# Same idea as the Vim setting above, but specifically for Neovim (`nvim`).
#
# Since you use both Vim and Neovim, we configure both independently.
#
set -g @resurrect-strategy-nvim 'session'


# =============================================================================
# TMUX-CONTINUUM SETTINGS
# =============================================================================

# -----------------------------------------------------------------------------
# Automatically restore the most recent tmux environment
# -----------------------------------------------------------------------------
#
# With this enabled, when the tmux server starts, Continuum restores the most
# recently saved Resurrect environment.
#
# Typical workflow:
#
#   Work normally
#       ↓
#   Continuum periodically saves your tmux environment
#       ↓
#   Reboot / shut down machine
#       ↓
#   Start tmux again
#       ↓
#   Previous sessions/windows/panes are restored automatically
#
set -g @continuum-restore 'on'


# =============================================================================
# TPM INITIALIZATION
# =============================================================================
#
# This line actually starts TPM.
#
# IMPORTANT: Keep it at the very bottom of ~/.tmux.conf.
#
# TPM reads all of the @plugin declarations above it and makes those plugins
# available to tmux.
#
run '~/.tmux/plugins/tpm/tpm'
